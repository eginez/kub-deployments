apiVersion: v1
kind: Namespace
metadata:
  name: storage

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-data-pv
  namespace: storage
spec:
  capacity:
    storage: 18Ti
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /mnt/data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - kub-cont

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-data-pvc
  namespace: storage
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 18Ti
  volumeName: nfs-data-pv

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: kub-cont
      containers:
      - name: nfs-server
        image: janeczku/nfs-ganesha:latest
        ports:
        - containerPort: 2049
          protocol: TCP
        - containerPort: 111
          protocol: UDP
        volumeMounts:
        - name: nfs-data
          mountPath: /export
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
            - SYS_RESOURCE
            - NET_ADMIN
      volumes:
      - name: nfs-data
        persistentVolumeClaim:
          claimName: nfs-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: storage
spec:
  type: ClusterIP
  selector:
    app: nfs-server
  ports:
  - port: 2049
    targetPort: 2049
    protocol: TCP
    name: nfs
  - port: 111
    targetPort: 111
    protocol: UDP
    name: rpc
